<title>A2 Additions and Fixes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Sans+Narrow:wght@400;700&display=swap">
<style>
/* Layout: a GO training-album sheet — brick-red band on top, one plate per row:
   picture left, the judging slip right; stacks to one column on a phone. */
:root{
  --paper:#ece3cc; --sheet:#f5efdf; --ink:#2b2520; --dun:#7d715a; --rule:#c9b994;
  --red:#8a2b1c; --on-red:#f3ead6; --teal:#2f5f5a;
  --ok:#3d7a4c; --mid:#b07a1e; --bad:#9a3220; --chipbg:#e2d7bb;
  --serif:"PT Serif",Georgia,"Times New Roman",serif;
  --narrow:"PT Sans Narrow","Arial Narrow",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#221d19; --sheet:#2c2621; --ink:#ebe2cf; --dun:#b0a487; --rule:#4d4336;
  --red:#7a2618; --on-red:#f3ead6; --teal:#86b5ae; --ok:#6fae7e; --mid:#d9a24a; --bad:#e07a62; --chipbg:#3a322a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#221d19; --sheet:#2c2621; --ink:#ebe2cf; --dun:#b0a487; --rule:#4d4336;
  --red:#7a2618; --on-red:#f3ead6; --teal:#86b5ae; --ok:#6fae7e; --mid:#d9a24a; --bad:#e07a62; --chipbg:#3a322a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--red)}
.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--red);color:var(--on-red);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.band h1{font-family:var(--narrow);font-weight:700;font-size:1.05rem;letter-spacing:.14em;text-transform:uppercase;margin:0}
.tally{display:flex;gap:12px;font-family:var(--narrow);font-size:.95rem;margin-left:auto;font-variant-numeric:tabular-nums}
.tally b{font-size:1.25rem}
.filters{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.filters button,.band .copy{font:inherit;font-family:var(--narrow);font-size:.85rem;letter-spacing:.04em;padding:3px 10px;border:1px solid var(--on-red);background:transparent;color:var(--on-red);border-radius:2px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--on-red);color:var(--red)}
#status{font-family:var(--narrow);font-size:.8rem;opacity:.9;width:100%}
main{max-width:1180px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.lead{max-width:70ch}
.lead p{margin:0 0 .6em}
.general{background:var(--sheet);border:1px solid var(--rule);padding:12px 14px;display:grid;gap:6px}
.general label{font-family:var(--narrow);text-transform:uppercase;letter-spacing:.1em;font-size:.8rem;color:var(--dun)}
textarea{width:100%;font:inherit;font-size:.95rem;background:transparent;color:var(--ink);border:1px solid var(--rule);padding:6px 8px;min-height:2.4em;resize:vertical;border-radius:2px}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.set{display:grid;gap:14px}
.set-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;border-bottom:2px solid var(--red);padding-bottom:4px}
.set-h h2{font-family:var(--narrow);font-weight:700;font-size:1.25rem;letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--red)}
.set-h .hint{color:var(--dun);font-style:italic}
.set-h .stat{margin-left:auto;font-family:var(--narrow);font-variant-numeric:tabular-nums}
.restage{font-family:var(--narrow);background:var(--bad);color:var(--sheet);padding:1px 8px;border-radius:2px}
.plate{background:var(--sheet);border:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:0}
.plate.hide{display:none}
.plate.v-pass{box-shadow:inset 4px 0 0 var(--ok)} .plate.v-fail{box-shadow:inset 4px 0 0 var(--bad)}
.pic{padding:10px;display:grid;gap:8px;align-content:start}
.pic a{display:block} .pic img{width:100%;display:block;border:1px solid var(--rule)}
.before{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px;align-items:start;font-family:var(--narrow);font-size:.8rem;color:var(--dun)}
.slip{padding:12px 14px;border-left:1px dashed var(--rule);display:grid;gap:10px;align-content:start;min-width:0}
.id{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.id .key{font-family:var(--narrow);color:var(--dun);font-variant-numeric:tabular-nums}
.id .lt{font-size:1.45rem;font-weight:700}
.id .pron{color:var(--dun)}
.cap{font-family:var(--narrow);font-size:1.05rem;letter-spacing:.03em;text-transform:uppercase;border:1px solid var(--ink);padding:2px 8px;justify-self:start}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--narrow);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:2px;background:var(--chipbg);color:var(--ink)}
.chip.PASS{background:var(--ok);color:var(--sheet)} .chip.WARN{background:var(--mid);color:var(--sheet)} .chip.FAIL{background:var(--bad);color:var(--sheet)}
dl{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 10px;font-size:.92rem}
dt{font-family:var(--narrow);text-transform:uppercase;letter-spacing:.08em;font-size:.76rem;color:var(--dun);padding-top:.2em}
dd{margin:0;min-width:0;overflow-wrap:anywhere}
.qa{font-size:.85rem;color:var(--dun)}
.qa .f{color:var(--bad)}
.judge{display:grid;gap:8px;border-top:1px solid var(--rule);padding-top:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .lbl{font-family:var(--narrow);text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;width:7.5em;color:var(--dun)}
.seg button,.tog{font:inherit;font-family:var(--narrow);font-size:.9rem;padding:4px 12px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;border-radius:2px;min-height:34px}
.seg{display:inline-flex}
.seg button+button{border-left:none}
.seg button[aria-pressed="true"][data-v="yes"],.seg button[aria-pressed="true"][data-v="ok"]{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.seg button[aria-pressed="true"][data-v="nearly"]{background:var(--mid);border-color:var(--mid);color:var(--sheet)}
.seg button[aria-pressed="true"][data-v="no"],.seg button[aria-pressed="true"][data-v="redo"]{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.tog[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.verdict{font-family:var(--narrow);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.verdict.pass{color:var(--ok)} .verdict.fail{color:var(--bad)} .verdict.open{color:var(--dun)}
#lbx{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out}
#lbx img{max-width:98vw;max-height:94vh}
@media (max-width:760px){.plate{grid-template-columns:minmax(0,1fr)}.slip{border-left:none;border-top:1px dashed var(--rule)}.tally{margin-left:0}}
@media (prefers-reduced-motion:no-preference){.plate{transition:box-shadow .15s}}
</style>

<div class="band"><div class="band-in">
  <h1 id="ttl"></h1>
  <div class="tally" id="tally"></div>
  <div class="filters" id="filters"></div>
  <span id="status">Connecting to the review store…</span>
</div></div>
<main id="main">
  <section class="lead" id="lead"></section>
  <section class="general">
    <label for="general">General notes on this batch</label>
    <textarea id="general" placeholder="Anything that applies to the whole set: style, staging rules, what to change before the roll-out."></textarea>
  </section>
  <div id="sets"></div>
</main>

  const lead=$('lead');
  if(MODE==='pilot'){

      el('p',{},'A card passes with Situation yes or nearly, not mistakable for its neighbour, and no stray act. Three or more failures in one set mean the staging rule is wrong, not the render: the set header turns red and the remaining ~133 cards wait.'));
  }else{
    lead.append(el('p',{},'The 43 picture cards added from the English A1–A2 benchmark (A2-1879 to A2-1957), drawn from their subject phrases with the F6.2 house style, and the five A1 re-rolls whose data was fixed today (290, 318, 336, 338, 339). Mark OK or Redo; a note on a Redo says what to change.'));

  const hints = MODE==='pilot' ? Object.fromEntries(EXTRA.sets.map(s=>[s.name,s.hint])) : {};

    const sec=el('section',{class:'set','data-set':g},el('div',{class:'set-h'},el('h2',{},g),el('span',{class:'hint'},hints[g]||''),el('span',{class:'stat','data-stat':g},'')));

function paint(){

    p.querySelectorAll('button[data-f]').forEach(b=>{const f=b.dataset.f;b.setAttribute('aria-pressed',String(b.dataset.v?v[f]===b.dataset.v:!!v[f]))});
    const ta=$('note-'+c.k); if(ta&&document.activeElement!==ta&&(v.note||'')!==ta.value)ta.value=v.note||'';
    const vt=p.querySelector('[data-verdict]'); vt.textContent=VTXT[vd]; vt.className='verdict '+vd;
    let show=true; if(F==='open')show=vd==='open'; else if(F==='fail')show=vd==='fail'; else if(F==='qa')show=c.qa==='WARN'||c.qa==='FAIL';

}

    const bits=MODE==='pilot'?[v.situation?'situation '+v.situation:'',v.neighbour_fail?'neighbour FAIL':'',v.stray?'stray act':'']:[v.verdict||''];

    snap.docs.forEach(d=>{const x=d.data();if(!x||!x.key)return;const mine=V[x.key];
      if(!mine||!mine.updatedAt||(x.updatedAt||'')>=mine.updatedAt){const{key,...rest}=x;V[x.key]=rest;n++}});
    const gd=await db.doc(META).get(); const gx=gd&&gd.exists?gd.data():null;
    if(gx&&(!G.updatedAt||(gx.updatedAt||'')>=G.updatedAt))G=gx;
    local(); paint(); status('Connected · '+n+' saved verdicts loaded · saves as you go');
  }catch(e){status('Could not read the review store ('+(e.code||'error')+'); working from this browser',true)}
})();
</script>
